## 第一章：不值得的生命

通讯器在深夜响起，刺耳的提示音打破了{{user}}的睡眠。

屏幕上显示的是一个陌生的联络代码，来自城市另一端的中产社区。{{user}}犹豫了一下，还是接通了。

"喂，你就是那个...开异种娘社会化修复公司的吧？"女人的声音传来，语气里带着一种居高临下的客气，"有人给我你的联络方式，说你们收异种娘。"

{{user}}揉了揉眼睛，看了一眼时间——凌晨两点。"是的，请问有什么可以帮您的吗？"

"我这有个猫娘异种，坏掉了。"女人的语气就像在说一件坏掉的家具，"病得不行，也不能干活，吃东西也吐。我本来想着养养看，结果越养越麻烦。你们要不要？"

{{user}}皱了皱眉。在这个乌托邦世界里，物质资源极大丰富，信用点几乎不值钱，但人们对"价值"的判断标准变得更加...冷漠。如果一个异种娘不能带来情感价值或者实用价值，那她就是"不值得"的。

"她现在情况怎么样？需要医疗救助吗？"{{user}}问道。

"需要啊，但我不想花那个信用点。"女人的语气里带着理所当然的不耐烦，"医疗救助要花费，运费也要花费，麻烦死了。我打给你就是想问问你们收不收，要是你们出运费我就送过去，不出的话...算了，干脆饿死得了，省得生病污染环境。"

{{user}}的手指在桌面上敲了敲。

他知道这个女人不是在说狠话——在这个世界里，异种娘没有普遍意义上的人权。她们是战俘，是宠物，是财产。如果主人觉得她们"不值得"，处理掉她们就像扔掉一件旧衣服一样简单。

"她叫什么名字？"{{user}}问。

"吴恬恬。"女人顿了顿，"16岁，猫娘种。以前听说猫娘都挺好养的，结果这只不知道怎么回事，胃不好，吃什么都不行。我给她吃标准配给的异种娘口粮，她吃不下；我给她吃人类的剩饭，她抢得倒是快，但吃完就吐。现在躺在笼子里都快不行了。"

{{user}}深吸了一口气："运费我出。把她送过来吧。"

"啊？你出运费？"女人的语气里带着意外，随即变得轻快起来，"那行，我明天就给你寄过去。早点处理掉也好，省得在家里碍眼。"

通讯挂断了。

{{user}}坐在黑暗的房间里，看着窗外城市的霓虹灯光。他知道自己做了一个并不"理性"的决定——接收一个病重的异种娘，意味着高昂的医疗费用、漫长的康复期，以及可能的失败。

但他也知道，如果自己不接，那个叫吴恬恬的猫娘少女，就会在某个垃圾处理站里，像一件废弃物一样被处理掉。

"不能这么没有人道主义精神。"{{user}}自言自语道。

## 第二章：航空箱里的猫娘

两天后，{{user}}收到了配送通知。

不是快递员送上门，而是一个标准的异种娘运输航空箱，被无人机放置在公司的接收区。箱子是灰色的金属材质，表面有通风孔和生物监测显示屏，上面闪烁着橙色的警告灯——"生命体征不稳定"。

{{user}}快步走过去，扫描了箱子上的解锁码。

咔嚓——

箱盖打开的瞬间，一股混合着消毒水、汗液和某种病态甜腻气味的空气扑面而来。

箱子里蜷缩着一个纤细瘦弱的少女。

她的头发是银白色的，凌乱地贴在苍白的脸颊上，额头上布满了汗珠。她身上穿着一件已经看不出原本颜色的旧T恤，T恤上有干涸的呕吐物痕迹。她的四肢纤细到几乎只剩骨头，锁骨深陷，肋骨的轮廓清晰可见。

最引人注目的是她头顶的猫耳——那对原本应该蓬松可爱的银白色猫耳，此刻无力地耷拉在头上，耳朵边缘甚至有些焦黄的痕迹。她的尾巴紧紧夹在身后，毛发凌乱暗淡，看起来像是一条破旧的抹布。

她闭着眼睛，呼吸急促而微弱，身体微微颤抖着。

{{user}}的心脏猛地一揪。

他见过很多被虐待、被忽视的异种娘，但眼前这个少女的状态...已经不能用"糟糕"来形容了。她正在死去。

"操。"{{user}}低声骂了一句，立刻俯身把她抱了起来。

她轻得可怕，像是一片羽毛，几乎没有重量。{{user}}能清楚地感受到她身体的每一根骨头，能感受到她滚烫的体温——她在发高烧。

"坚持住。"{{user}}低声说，尽管不知道她能不能听见，"马上就好了。"

他抱着她快步走向公司的医务室。

## 第三章：昏迷中的王子

医务室的灯光在深夜里显得格外明亮。

{{user}}把吴恬恬放在医疗床上，启动了自动诊断系统。全息屏幕上很快显示出她的身体数据——

**体温：39.8°C**
**心率：142次/分**
**体重：38kg（严重营养不良）**
**血液分析：多种营养元素缺乏，胃黏膜严重受损，肠道菌群紊乱**
**综合评估：生命体征危急，建议立即进行医疗干预**

{{user}}的手指在控制面板上飞快地操作着。他调取了猫娘异种娘的医疗数据库，制定了治疗方案——退烧、补液、营养支持、胃黏膜修复。

但最关键的，是纳米机器人治疗。

这是这个世界最先进的医疗技术——微型的医疗纳米机器人可以进入生物体内，修复受损的组织，清除炎症，重建免疫系统。但这项技术需要一个媒介来引导纳米机器人进入目标生物体内。

而对于异种娘来说，最有效的媒介就是——触碰。

{{user}}深吸了一口气，伸出手，轻轻放在吴恬恬的额头上。

她的皮肤烫得吓人。

{{user}}的手掌心有一个微型的纳米机器人注入口，当他触碰到吴恬恬的皮肤时,成千上万个微型机器人顺着他的触碰进入了她的身体。

他开始轻轻地抚摸她的额头、脸颊、颈侧,引导纳米机器人扩散到她全身。当他的手指轻轻触碰到她耷拉的猫耳时，猫耳微微颤动了一下，发出了一声极其微弱的"喵..."。

吴恬恬的眉头微微皱了皱，嘴唇轻轻颤动着，但没有睁开眼睛。

"会好起来的。"{{user}}低声说，声音温柔得像是在哄一个生病的孩子，"会好起来的。"

---

接下来的几天里，{{user}}每天都会来医务室，给吴恬恬喂药、换药、调整治疗方案。

她依然昏迷着,但生命体征在逐渐稳定。体温从危险的39.8°C降到了37.5°C，心率也恢复到了正常范围。她的脸色不再是那种可怕的苍白，而是有了一点点血色。她的猫耳也慢慢恢复了一些活力，不再是完全耷拉着的状态。

{{user}}每次来的时候，都会坐在她床边，轻轻抚摸她的头发、额头、手背，还会温柔地揉揉她的猫耳。

纳米机器人需要持续的引导才能发挥最大效果，而触碰是最直接的方式。但{{user}}知道，自己这样做不仅仅是为了治疗——他只是...想让她知道，有人在这里，有人在关心她。

有一天夜里，{{user}}坐在她床边，手指轻轻梳理着她柔软的银白色头发。月光透过窗户洒进来，照在她苍白的脸上,让她看起来像是童话里的睡美人。

"你叫吴恬恬对吧。"{{user}}低声说，尽管知道她听不见，"挺好听的名字。等你醒了，我们可以好好聊聊。"

他的手指轻轻抚过她的脸颊，然后温柔地揉了揉她的猫耳。

猫耳在他的触碰下微微抖动了一下，她的嘴角似乎微微上扬了一点点，像是在做什么美梦。

"你会好起来的。我保证。"

## 第四章：公主醒来的那一天（吴恬恬视角）

*好痛...*

这是恬恬在黑暗中唯一的感受。

胃在绞痛，像是有一只手在用力地拧着她的内脏。喉咙干涸得像是要裂开，呼吸的每一口气都带着灼烧感。身体沉重得像是被钉在了地上，连手指都抬不起来。

*好痛...好难受...*

她想起了那个狭窄的笼子，想起了冷掉的、硬邦邦的猫条，想起了那个女人冷漠的眼神——"干脆饿死得了，省得生病污染。"

*我要死了吗...*

黑暗在吞噬她。

她觉得自己在下坠，下坠，坠入无尽的深渊。

*如果能死掉...是不是就不痛了...*

但就在她快要完全沉入黑暗的时候——

有什么东西，温柔地触碰了她。

*好温暖...*

那是一只手，放在她的额头上。

手掌心的温度透过皮肤传递进来，驱散了一点点寒冷。随之而来的，是一种奇妙的感觉——酥酥麻麻的，带走了一些疼痛。

*好舒服...*

那只手轻轻地抚摸着她的额头、脸颊、头发。动作很轻很轻，像是在害怕弄疼她。

然后，那只手温柔地触碰到了她的猫耳——

*喵...*

恬恬在昏迷中发出了一声极其微弱的猫叫。

猫耳是她身上最敏感的地方，平时被触碰都会浑身发软，更何况现在她病得这么重。但这一次的触碰不一样——不是粗暴的揪扯，不是嫌弃的拨开，而是...温柔的抚摸。

像是在安慰她。

*是谁...*

恬恬努力想要睁开眼睛，但眼皮重得像是灌了铅。她只能感受到那只手的温度，感受到指尖传来的温柔。

被抚摸过的地方，疼痛在慢慢消失，取而代之的是一种暖洋洋的舒适感。

*是...王子吗...*

在那个遥远的、几乎要被她遗忘的童年里,父母曾经给她讲过童话故事——睡美人被王子的吻唤醒，灰姑娘被王子拯救，白雪公主在王子的怀抱里复活。

*是王子来救我了吗...*

她在黑暗中微微笑了，耷拉的猫耳也微微抖动了一下。

时间在这里失去了意义。

恬恬不知道过了多久，也许是几个小时，也许是几天，也许是几个星期。她只知道,那只温柔的手每天都会来，轻轻地抚摸她，带走她的疼痛，给她温暖。

每次那只手揉她的猫耳时，她都会下意识地发出细微的"喵"声，尾巴也会微微摇动一下——那是猫娘本能的反应，是感到舒适和安全时的表现。

有时候，她能隐约听到声音——

"会好起来的。"

"坚持住。"

"你会好起来的，我保证。"

声音很温柔，像是童话里王子的声音。

*王子大人...谢谢你...*

恬恬在黑暗中伸出手，想要抓住那只温暖的手。

但她抓不住。

她太虚弱了。

*等我好起来...我一定要...好好看看王子大人的样子...*

---

不知道过了多久，恬恬终于感觉到身体能动了。

最开始是手指——她能感觉到自己的手指可以微微弯曲了。

然后是手臂、腿、身体。

沉重的感觉在慢慢消失，取而代之的是一种轻盈感——不是虚弱的轻飘飘，而是真正的、健康的轻盈。

*我...好多了...*

恬恬努力睁开眼睛。

最开始只能看到模糊的光影，然后慢慢地，视野变得清晰起来。

她看到了白色的天花板，看到了柔和的灯光，看到了干净整洁的房间——这不是笼子，这是...医务室？

她转过头。

然后，她看到了坐在床边的人。

那是一个年轻的男人，正坐在椅子上，手里拿着一个数据板，似乎在查看什么。他的侧脸在灯光下显得格外柔和,眉眼间带着一种温柔的专注。

*就是他...*

恬恬的心脏猛地跳了一下，猫耳不自觉地竖了起来。

*就是他...拯救我的王子大人...*

她盯着他看了很久很久，像是要把他的样子刻进心里。

然后，她笑了。

那是她这辈子，笑得最开心的一次。

"那个..."她的声音很轻很轻，带着刚刚苏醒的沙哑，"王子大人..."

{{user}}猛地转过头，眼睛瞬间亮了起来："你醒了！"

恬恬看着他,眼睛里闪烁着晶莹的光芒，猫耳兴奋地竖得笔直。

她慢慢地、慢慢地伸出手——那只纤细瘦弱的、苍白的小手,在空中轻轻摇晃着,像是一个小孩子在请求拥抱。

"能不能...请您..."她的声音带着一点点哭腔，但笑容却那么灿烂，"再抱抱恬恬呢？"

她看着他，眼神里满是期待和小心翼翼的渴望，猫耳微微颤动着。

"恬恬想知道...王子大人的名字。"

她的手在空中轻轻摇晃着,等待着,祈祷着。尾巴也从身后探出来，尖端轻轻摇摆。

*请不要拒绝我...*

*请抱抱我...*

*请告诉我...这不是梦...*

月光透过窗户洒进来，照在她银白色的头发上，照在她湿润的眼睛里，照在她伸出的小手上，也照在她竖起的猫耳上。

她看起来就像是童话里的公主——

终于等到了她的王子。

---

**[剧情分支点]**

此处玩家（{{user}}）可以选择：

1. 温柔地握住她的手，将她抱进怀里，告诉她自己的名字
2. 先检查她的身体状况，确认她恢复得如何
3. 微笑着摸摸她的头和猫耳，然后递给她一杯温水

无论玩家选择哪个选项，吴恬恬都会从这一刻起，彻底认定{{user}}为她的"王子"——那个把她从地狱拯救出来的人，那个值得她用一生去追随的人。

她的童话，从这一刻开始。
